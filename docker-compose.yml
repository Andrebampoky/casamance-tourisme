services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casamance}
      POSTGRES_USER: ${POSTGRES_USER:-casamance}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-casamance}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - casamance-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks: [casamance-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  reservation-service:
    build: ./services/reservation-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/${RESERVATION_DB_NAME:-casamance}
      DB_USERNAME: ${POSTGRES_USER:-casamance}
      DB_PASSWORD: ${DB_PASSWORD:-casamance}
      RESERVATION_ADMIN_TOKEN: ${RESERVATION_ADMIN_TOKEN:-local-admin-change-me}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    depends_on:
      db: {condition: service_healthy}
    networks: [casamance-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/internal/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  tourism-service:
    build: ./services/tourism-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/${TOURISM_DB_NAME:-casamance_experience}
      DB_USERNAME: ${POSTGRES_USER:-casamance}
      DB_PASSWORD: ${DB_PASSWORD:-casamance}
      RESERVATION_ADMIN_TOKEN: ${RESERVATION_ADMIN_TOKEN:-local-admin-change-me}
      RESERVATION_SERVICE_URL: http://reservation-service:8080
    depends_on:
      db: {condition: service_healthy}
      reservation-service: {condition: service_healthy}
    networks: [casamance-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/internal/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    environment:
      DB_URL: jdbc:postgresql://db:5432/${NOTIFICATION_DB_NAME:-casamance_notifications}
      DB_USERNAME: ${POSTGRES_USER:-casamance}
      DB_PASSWORD: ${DB_PASSWORD:-casamance}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:4201}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@casamance.local}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_DISPATCH_INTERVAL_MS: ${MAIL_DISPATCH_INTERVAL_MS:-30000}
    depends_on:
      db: {condition: service_healthy}
    networks: [casamance-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/internal/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  gateway:
    build: ./gateway
    ports: ["${API_PORT:-8081}:80"]
    depends_on:
      reservation-service: {condition: service_healthy}
      tourism-service: {condition: service_healthy}
    networks: [casamance-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/internal/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["${WEB_PORT:-4201}:80"]
    depends_on:
      gateway: {condition: service_healthy}
    networks: [casamance-net]
    restart: unless-stopped

networks:
  casamance-net:
    driver: bridge
volumes:
  casamance-data:
