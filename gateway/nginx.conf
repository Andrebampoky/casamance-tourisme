server {
  listen 80;
  server_name _;
  location = /internal/health { access_log off; return 200 "UP"; add_header Content-Type text/plain; }
  location ~ ^/api/(bookings|admin/bookings|visits|tickets|satisfaction)(/|$) {
    proxy_pass http://reservation-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location ~ ^/api/(itineraries|events|admin/events)(/|$) {
    proxy_pass http://tourism-service:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { return 404; }
}
