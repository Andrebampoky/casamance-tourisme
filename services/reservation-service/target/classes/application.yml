spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/casamance}
    username: ${DB_USERNAME:casamance}
    password: ${DB_PASSWORD:casamance}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8081}
  admin-token: ${RESERVATION_ADMIN_TOKEN:}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8080}
server:
  port: ${SERVER_PORT:8080}
