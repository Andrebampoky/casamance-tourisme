spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/casamance_notifications}
    username: ${DB_USERNAME:casamance}
    password: ${DB_PASSWORD:casamance}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
app:
  mail:
    from: ${MAIL_FROM:no-reply@casamance.local}
    dispatch-interval-ms: ${MAIL_DISPATCH_INTERVAL_MS:30000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4201}
server:
  port: ${SERVER_PORT:8080}
